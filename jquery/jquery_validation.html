<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jquery validation</title>
    <style>
        .login-error-valid {
            color: red;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <form id="register" action="jquery_validation.html">
        <div> <label for="">Fullname</label>
            <input type="text" name="fullname" id="fullname"><br>
        </div>
        <div>
            <label for="">Email</label>
            <input type="text" name="email" id="email"><br>

        </div>

        <div>

            <label for="">Tel</label>
            <input type="mobile" name="tel" id="tel"><br>
        </div>


        <button type="submit">Submit</button>
    </form>

    <script src="jquery-4.0.0.min.js"></script>
    <script src="jquery-validation/jquery.validate.min.js"></script>
    <script>
        $("form#register").validate({
            rules: {
                fullname: {
                    required: true
                },
                email: {
                    required: true
                },
                tel: {
                    required: true
                }
            },
            messages: {
                fullname: {
                    required: "ต้องกรอกชื่อ",
                },
                email: {
                    required: "ต้องกรอกemail",
                },
                tel: {
                    required: "ต้องกรอกเบอร์",
                },
            },
            errorClass: "login-error-valid",
            errorPlacement: function (error, element) {
                error.appendTo(element.parent());
                //error.appendTo("help-block");
            },
            submitHandler: function (form) {

            }
        })
    </script>
</body>

</html>
